# Read by SonarCloud automatic analysis. Note this is deliberately NOT
# sonar-project.properties, which automatic analysis ignores.

# Exclusions for copy-paste detection.
# Portfolio/data.ts is a literal array of uniform project, experience and
# contribution records. Every entry repeats the same key sequence by
# definition, so CPD reports it as duplication with nothing to actually
# deduplicate. It has failed the quality gate on every PR that touches the
# file while raising zero issues. Wildcards are not supported here, so this
# is an exact path.
sonar.cpd.exclusions=components/apps/Portfolio/data.ts

# the room kit's generators are local dev tools that don't ship: roomSpan.js
# runs the repo's own typescript theme files to read their values, and
# embedPoster.js screenshots a local build
sonar.exclusions=scripts/roomSpan.js,scripts/embedPoster.js
